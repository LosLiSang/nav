# Development only. Never deploy this config.
name = "nav-local-proxy"
main = "index.ts"
compatibility_date = "2025-09-22"
compatibility_flags = ["global_fetch_strictly_public"]

[[d1_databases]]
binding = "DB"
database_name = "nav-sync"
database_id = "880e5230-2474-41a2-a7cb-ea6bb2fffe13"
migrations_dir = "../migrations"

[vars]
# LOCAL_WIRE_URL / LOCAL_WIRE_TOKEN supplied only by the local launcher.
ALLOWED_ORIGIN = "http://127.0.0.1:5173,http://localhost:5173"
ADMIN_GITHUB_LOGINS = "LosLiSang"
LEGACY_SYNC = "off"
