name = "nav"
main = "src/index.ts"
compatibility_date = "2025-09-22"

# 本地开发（npm run dev）会自动在 .wrangler/state 下建一个本地 SQLite。
# 表结构由 migrations/ 管理：npm run db:migrate:local / db:migrate:remote
[[d1_databases]]
binding = "DB"
database_name = "nav-sync"
database_id = "880e5230-2474-41a2-a7cb-ea6bb2fffe13"
migrations_dir = "migrations"

[vars]
# 前端站点 origin（逗号分隔）：账号/数据接口的 CORS 白名单 + GitHub 登录回跳白名单
ALLOWED_ORIGIN = "https://loslisang.github.io"
# 这些 GitHub 账号登录后自动成为管理员
ADMIN_GITHUB_LOGINS = "LosLiSang"
# 旧 SYNC_TOKEN：已全部迁移到 GitHub 登录，彻底停用（"read" 可临时恢复只读）
LEGACY_SYNC = "off"

# secrets（不入库）：
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   （SYNC_TOKEN 已停用，可执行 npx wrangler secret delete SYNC_TOKEN 删除）
# 本地开发写在 worker/.dev.vars（同名键会覆盖上面的 vars）
